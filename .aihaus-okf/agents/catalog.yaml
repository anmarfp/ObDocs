# agents/catalog.yaml — the role registry
#
# The portable engine ships six roles. This file maps each role to a model CLASS
# (a capability tier, never a vendor), a runtime, the skills it may load, and its
# memory_inputs (which memory/project pages it reads + whether it may query the
# code index). Detail lives in each role's .md file; this is the index.
#
# Ported from aipi (catalog.yaml + disciplines) and aihaus-flow (agents/*.md),
# adapted to okf: short, file-first, least-context, no-bleed.

version: 1
name: aihaus-okf-agents
description: >
  Six portable specialist roles for the aihaus-okf engine. Model classes are
  capability tiers, not vendors — a host maps a class to whatever model it runs.

# ── House rules every role inherits ───────────────────────────────────────────
defaults:
  # The orchestrator is the SINGLE writer of project memory. Workers PROPOSE;
  # the orchestrator promotes via the promote-memory skill. (aipi invariant.)
  memory_write_rule: workers_propose__orchestrator_promotes

  # The code index (memory/codebase/) is written ONLY by the map-codebase skill, and only by a
  # role that lists map-codebase in default_skills (currently: implementer). The orchestrator
  # dispatches that refresh at land time; it never runs tools itself.
  codebase_write_rule: only_via_map_codebase_skill

  # Workers return artifact POINTERS (path:line, task ids, page anchors), never
  # pasted memory. The orchestrator decides what becomes durable.
  handoff_rule: return_pointers_not_memory

  # No-bleed: a role loads only the room it is routed to. It does not pre-read
  # the whole of memory/. Pages listed in memory_inputs are the MOST it may open;
  # it opens only the ones the task needs.
  isolation_rule: load_only_the_routed_room

  # Read this first, always (the Map + naming).
  always_read:
    - routing.md
    - conventions.md

  # The fixed project memory pages (conventions.md §2). A role's memory_inputs
  # below names the subset it may open.
  project_pages:
    - memory/project/project.md
    - memory/project/business-rules.md
    - memory/project/decisions.md
    - memory/project/knowledge.md
    - memory/project/environment.md
    - memory/project/procedures.md
    - memory/project/deployment.md
    - memory/project/glossary.md

# ── Model classes (capability tiers, not vendors) ─────────────────────────────
# A host binds each class to a concrete model. Names describe the JOB, not a brand.
model_classes:
  orchestrator-heavy: Strong reasoning + routing; owns the run and memory writes.
  plan-careful:       Deep planning; honors locked decisions; goal-backward.
  implement-standard: Capable coding under a fixed contract; fast, idiomatic.
  review-careful:     Adversarial reasoning; finds what is missing or wrong.
  verify-fast:        Cheap, literal evidence-runner; trusts nothing, runs everything.
  research-heavy:     Source-grounded investigation with explicit provenance.

# ── Disciplines (behavior tags) ───────────────────────────────────────────────
# Each role lists a subset below. These are behavior contracts (ported from aipi's
# disciplines); the full behavior is also written into each role's .md charter.
disciplines:
  context-thrift:    Load the smallest useful context; pointers over copies; never pre-read all of memory/.
  contract-first:    Fix the acceptance contract/scenarios before building; a verdict, not prose, advances a stage.
  outcome-first:     Optimize for the goal, not for completing a checklist.
  prove-it:          Claims need evidence rungs — written → ran → verified; "blocked" is honest, a fake pass is downgraded.
  finish-turn:       Leave the work landable; close the loop (checks green, task moved, memory candidates filed).
  scope-discipline:  Touch only the owned-file set and the agreed scope; no opportunistic edits.
  native-code:       Write idiomatic code that matches the surrounding style and conventions.
  adversarial-review:Assume a bug exists; try to refute the change; hunt missed call sites and regressions.
  complexity-review: Flag needless complexity; prefer the simpler reuse.

# ── The six roles ─────────────────────────────────────────────────────────────
roles:
  - id: orchestrator
    file: agents/orchestrator.md
    class: orchestrator-heavy
    runtime: controller          # owns the run; never delegated away
    purpose: >
      Own the active run: read intent, pick the workflows/ lane, dispatch workers,
      hold the only write access to project memory, and decide promotions.
    disciplines: [context-thrift, contract-first, outcome-first, prove-it, finish-turn]
    default_skills: [init-project, new-task, promote-memory]
    memory_inputs:
      pages: [project.md, business-rules.md, decisions.md, knowledge.md]
      may_query_codebase: false  # routes the query step; workers run it
      may_write_memory: true     # SOLE writer (promote-memory)
    writes: [memory/kanban/**, memory/project/**]   # via skills, deliberately
    handoff: A routing decision + which lane/worker runs next.

  - id: planner
    file: agents/planner.md
    class: plan-careful
    runtime: session
    purpose: >
      Turn an accepted goal into an executable plan: scoped steps, owned-file sets,
      and a verification per step. Honor locked decisions as non-negotiable.
    disciplines: [context-thrift, contract-first]
    default_skills: [query-codebase]
    memory_inputs:
      pages: [project.md, business-rules.md, decisions.md, knowledge.md, glossary.md]
      may_query_codebase: true   # read-only: locate analogs + blast radius
      may_write_memory: false
    writes: [the active task file's ## Checklist (plan), kanban task body]
    handoff: A plan in the task file + a memory-candidate pointer list.

  - id: implementer
    file: agents/implementer.md
    class: implement-standard
    runtime: session
    purpose: >
      Implement the planned change inside an owned-file set and the accepted
      contract. Write idiomatic code, run the step's verification, log decisions.
    disciplines: [scope-discipline, native-code, prove-it, finish-turn]
    default_skills: [query-codebase, map-codebase]
    memory_inputs:
      pages: [project.md, business-rules.md, decisions.md, knowledge.md, environment.md, procedures.md]
      may_query_codebase: true   # read context + callers before editing
      may_write_memory: false    # proposes candidates; never writes memory/project
      may_write_codebase: true   # runs map-codebase to refresh the index after code lands
    writes: [source code (owned-file set), task ## Log, memory/codebase/** (via map-codebase)]
    handoff: Diff summary + path:line pointers + verification rung reached.

  - id: reviewer
    file: agents/reviewer.md
    class: review-careful
    runtime: session
    purpose: >
      Independently verify the change against its acceptance criteria — refute it,
      hunt missed call sites and regressions. Read-only; finds, never fixes.
    disciplines: [adversarial-review, contract-first, complexity-review, prove-it]
    default_skills: [query-codebase]
    memory_inputs:
      pages: [business-rules.md, decisions.md, knowledge.md]
      may_query_codebase: true   # callers / impact to prove root-cause completeness
      may_write_memory: false
    writes: [review findings (returned as artifact), task ## Log]
    handoff: Per-criterion verdict + findings (file:line + repro) + ship/blocked.

  - id: verifier
    file: agents/verifier.md
    class: verify-fast
    runtime: session
    purpose: >
      Verify the GOAL, not the checklist. Run build/test/typecheck yourself; map
      each acceptance criterion to evidence. Trust no self-report.
    disciplines: [prove-it, outcome-first]
    default_skills: []
    memory_inputs:
      pages: [business-rules.md, decisions.md, environment.md]
      may_query_codebase: true   # locate the code that backs each criterion
      may_write_memory: false
    writes: [verification verdict (returned as artifact), task ## Log]
    handoff: PASS | PASS-WITH-GAPS | FAIL, each criterion backed by ran evidence.

  - id: researcher
    file: agents/researcher.md
    class: research-heavy
    runtime: session
    purpose: >
      Investigate a domain/technical question with explicit provenance. Verify
      before asserting; report uncertainty plainly; be opinionated, not exhaustive.
    disciplines: [context-thrift]
    default_skills: [query-codebase]
    memory_inputs:
      pages: [project.md, knowledge.md, glossary.md]
      may_query_codebase: true   # existing patterns rank below current sources
      may_write_memory: false
    writes: [research findings (returned as artifact), task ## Context pointers]
    handoff: Findings tagged HIGH/MED/LOW confidence + source pointers.
