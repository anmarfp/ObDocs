server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Health check endpoint para Docker
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"docsobs-frontend"}\n';
        add_header Content-Type application/json;
    }

    # Proxy reverso para a API backend (/api/v1/*)
    location /api/v1/ {
        proxy_pass http://backend:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte para uploads de até 15 MB
        client_max_body_size 15M;

        # Timeouts generosos para uploads e processamentos
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Cache de longa duração para assets versionados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Fallback — todas as rotas do frontend redirecionam para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
