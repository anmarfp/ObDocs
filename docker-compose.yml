# ==============================================================================
# DocsOb — Docker Compose (Full-Stack: PostgreSQL + Backend + Frontend)
# ==============================================================================
# Início rápido: docker compose up -d --build
# Parada: docker compose down
# Reset completo: docker compose down -v && docker compose up -d --build

services:
  # ---------- Banco de Dados PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docsob}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docsob}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - docsob-network

  # ---------- Backend API (Express + Prisma) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-docsob}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-docsob_secret_key_change_in_production}
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_BYTES: "10485760"
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docsob-network

  # ---------- Frontend SPA (Nginx + Vite Build) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docsob-network

# ---------- Volumes Nomeados Persistentes ----------
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

# ---------- Rede Isolada ----------
networks:
  docsob-network:
    driver: bridge
